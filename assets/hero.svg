<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Shrey Raval: building intelligent systems with a hacker's curiosity">
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#121716"/><stop offset="1" stop-color="#080C0B"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#C3F3D0" stop-opacity=".16"/><stop offset="1" stop-color="#C3F3D0" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#D9EEE0" stroke-opacity=".055"/></pattern>
 <style>
 text{font-family:Arial,Helvetica,sans-serif}
 .mono{font-family:'Courier New',monospace}
 .line{stroke:#CBF4D7;stroke-width:1;fill:none;opacity:.38}
 .pulse{animation:pulse 4s ease-in-out infinite}
 .spin{transform-origin:950px 216px;animation:spin 32s linear infinite}
 @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
 @keyframes spin{to{transform:rotate(360deg)}}
 @media (prefers-reduced-motion:reduce){.pulse,.spin{animation:none}}
 </style>
</defs>
<rect width="1200" height="420" rx="18" fill="url(#bg)"/>
<rect width="1200" height="420" rx="18" fill="url(#grid)"/>
<circle cx="952" cy="212" r="270" fill="url(#glow)"/>
<rect x="30" y="29" width="1140" height="362" rx="8" fill="none" stroke="#C1D8C7" stroke-opacity=".18"/>
<g class="mono" font-size="13" letter-spacing="2" fill="#AFBDB3">
<text x="62" y="67">SHREY.RAVAL / SYSTEM PROFILE</text><text x="1025" y="67">EST. 1996</text>
</g>
<circle cx="65" cy="98" r="4" fill="#BDF6C8" class="pulse"/>
<text x="79" y="103" fill="#BDF6C8" class="mono" font-size="12" letter-spacing="1">BUILD MODE: ON</text>
<text x="62" y="202" fill="#F4F0E8" font-weight="700" font-size="72" letter-spacing="-3">Hello, world.</text>
<text x="65" y="250" fill="#E5E9DE" font-size="25" letter-spacing="-.4">I'm Shrey. I make systems think.</text>
<text x="65" y="281" fill="#9DAFA4" font-size="20">Then I ask how they might break.</text>
<path d="M64 318H540" stroke="#DFE6DC" stroke-opacity=".18"/>
<text x="65" y="347" fill="#BCEFC9" class="mono" font-size="13" letter-spacing="1">FOUNDER  /  BUILDER  /  CURIOUS BY DEFAULT</text>
